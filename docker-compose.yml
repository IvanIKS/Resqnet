services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: resqnet
      POSTGRES_PASSWORD: resqnet
      POSTGRES_DB: resqnet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqnet -d resqnet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg2://resqnet:resqnet@db:5432/resqnet
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
